<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141818"/>
      <stop offset="100%" stop-color="#0d0f0f"/>
    </linearGradient>
    <linearGradient id="tealGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="tealGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#222828" stroke-width="1.5"/>

  <!-- Geometric Interlocking Outer Loops (Knowledge Loop & Infinite Gateway) -->
  <g filter="url(#subtleGlow)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top-Left to Bottom-Right Knot -->
    <path d="M 38 60 C 22 42, 26 24, 46 24 C 62 24, 60 52, 60 60 C 60 68, 58 96, 74 96 C 94 96, 98 78, 82 60" 
          stroke="url(#tealGrad1)"/>
    <!-- Top-Right to Bottom-Left Knot -->
    <path d="M 60 38 C 78 22, 96 26, 96 46 C 96 62, 68 60, 60 60 C 52 60, 24 58, 24 74 C 24 94, 42 98, 60 82" 
          stroke="url(#tealGrad2)"/>
  </g>

  <!-- Central Compass Star & Aperture (Search & Sourcing Precision) -->
  <g transform="translate(60, 60)">
    <!-- Cardinal Compass Points -->
    <polygon points="0,-26 3.5,-9 9,-3.5 26,0 9,3.5 3.5,9 0,26 -3.5,9 -9,3.5 -26,0 -9,-3.5 -3.5,-9" fill="url(#tealGrad1)"/>
    <!-- Diagonal Compass Points -->
    <polygon points="0,-17 2.5,-6 6,-2.5 17,0 6,2.5 2.5,6 0,17 -2.5,6 -6,2.5 -17,0 -6,-2.5 -2.5,-6" fill="url(#tealGrad2)" transform="rotate(45)"/>
    
    <!-- Central Aperture Iris -->
    <circle cx="0" cy="0" r="6.5" fill="#0d0f0f" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="0" cy="0" r="2.5" fill="#5eead4"/>
  </g>
</svg>
